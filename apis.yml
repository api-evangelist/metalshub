aid: metalshub
name: Metalshub
description: 'Metalshub (Metals Hub GmbH) is a Berlin-based digital platform for the
  metals, mining, and recycling industries, enabling over 2,800 industry participants
  to buy, sell, and trade raw materials online. Its procurement, sales, and tolling
  solutions help companies source ferroalloys, minor metals, noble alloys, and recycled
  materials, discover new suppliers and customers, run digital tenders and auctions,
  and manage the full transaction lifecycle from negotiation to contract. Backed by
  Point Nine and other investors, Metalshub operates a login-gated trading application
  at trade.metals-hub.com. No public API or developer program was found during enrichment.'
